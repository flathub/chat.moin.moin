id: chat.moin.moin
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: moin
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
modules:
  - name: moin
    buildsystem: simple
    build-commands:
      - install -d /app/chat.moin.moin
      - cp -a lib/moin/. /app/chat.moin.moin/
      - cp -a share /app/
      - install -d /app/bin
      - ln -s /app/chat.moin.moin/moin_flutter /app/bin/moin
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://moin.chat/downloads/linux/2026.1/moin-2026.1-linux-x86_64.tar.xz
        sha256: '32bb5f8e9dcf8ee34af6b2db776dcde122363c4ab189865504db033208c3f987'
        strip-components: 0
