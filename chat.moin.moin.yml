id: chat.moin.moin
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: moin
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0:ro
  - --device=dri
modules:
  - name: moin
    buildsystem: simple
    build-commands:
      - install -d /app/chat.moin.moin
      - cp -a lib/moin/. /app/chat.moin.moin/
      - cp -a share /app/
      - install -d /app/bin
      - ln -s /app/chat.moin.moin/moin_flutter /app/bin/moin
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://moin.chat/downloads/linux/2026.6/moin-2026.6-linux-x86_64.tar.xz
        sha256: '6148b5c612c9ef4a37597914ab91abb33ef9877a598059c651b87dca4c36642e'
        strip-components: 0
