id: chat.moin.moin
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: moin
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0:ro
  - --device=dri
modules:
  - name: moin
    buildsystem: simple
    build-commands:
      - install -d /app/chat.moin.moin
      - cp -a lib/moin/. /app/chat.moin.moin/
      - cp -a share /app/
      - install -d /app/bin
      - ln -s /app/chat.moin.moin/moin_flutter /app/bin/moin
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://moin.chat/downloads/linux/2026.8/moin-2026.8-linux-x86_64.tar.xz
        sha256: '93b42c5a6652cb5360a2e4a9e682ccb0db955ce54fb6c877bcb6813f9d0f02eb'
        strip-components: 0
